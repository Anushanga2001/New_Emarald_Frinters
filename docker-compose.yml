version: '3.8'

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: logistics-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-Dev_Password1!}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - shipping-network

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: shipping-backend
    ports:
      - "5253:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=mssql,1433;Database=logistics_db;User Id=sa;Password=${DB_PASSWORD:-Dev_Password1!};TrustServerCertificate=True
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      mssql:
        condition: service_healthy
    volumes:
      - ./Backend/data:/app/data
      - ./Backend/Backend.API/appsettings.json:/app/appsettings.json
      - ./Backend/Backend.API/appsettings.Development.json:/app/appsettings.Development.json
    restart: unless-stopped
    networks:
      - shipping-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/swagger/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: shipping-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - shipping-network
    environment:
      - VITE_API_URL=http://localhost:5253/api

networks:
  shipping-network:
    driver: bridge

volumes:
  backend-data:
    driver: local
  mssql_data:
    driver: local
